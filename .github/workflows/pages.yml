name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SITE_URL: https://mapseekai.github.io
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static website
        run: pnpm build
      - name: Verify pages and internal links
        run: pnpm test
      - name: Check out latest emap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mapseekai/emap
          path: .emap-source
          persist-credentials: false
      - name: Wait for the checked-out emap commit to pass CI
        if: github.event_name != 'pull_request'
        run: node scripts/wait-for-emap-ci.mjs
      - name: Check out latest emap-web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mapseekai/emap-web
          path: .emap-web
          persist-credentials: false
      - name: Install locked emap dependencies
        working-directory: .emap-source
        run: pnpm install --frozen-lockfile
      - name: Install locked emap-web dependencies
        working-directory: .emap-web
        run: pnpm install --frozen-lockfile
      - name: Build and verify emap documentation and examples
        working-directory: .emap-web
        env:
          EMAP_SOURCE_DIR: ${{ github.workspace }}/.emap-source
        run: pnpm run verify
      - name: Compose emap documentation into the website
        run: |
          node --input-type=module <<'NODE'
          import { cp, readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const source = '.emap-web/build';
          for (const file of ['index.html', 'en/index.html', 'api/index.html', 'examples/index.html', 'examples/sources/getting-started/lines/manifest.json']) {
            await readFile(`${source}/${file}`);
          }
          const target = 'dist/mapseekai/emap';
          await cp(source, target, { recursive: true });
          const commit = execFileSync('git', ['-C', '.emap-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const docsCommit = execFileSync('git', ['-C', '.emap-web', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const docs = { repository: 'mapseekai/emap-web', commit: docsCommit };
          await writeFile(`${target}/deployment.json`, JSON.stringify({ repository: 'mapseekai/emap', commit, docs }, null, 2) + '\n');
          NODE
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
